# =============================================================================
# Semgrep rules for n8n workflow exports (JSON)
#
# Conventions used by the scanner backend (app/scanner.py):
#   metadata.title        Short human-readable title shown in the UI
#   metadata.brief        One plain-English sentence for reports (PDF)
#   metadata.risk         critical | high | medium | low | info  (UI severity)
#   metadata.category     secrets | transport | injection | code-execution |
#                         access-control | data-exposure
#   metadata.cwe          CWE reference
#   metadata.remediation  Actionable fix shown to the user
#
# Notes on Semgrep's JSON matching:
#   * `{..., "k": v, ...}` matches any object containing that key (order-free).
#   * When a metavariable binds a JSON *key*, its text includes the quotes, so
#     key regexes are written as  ^"?(...)"?$ .
#   * n8n expressions are strings starting with "=" (e.g. "={{ $json.x }}").
#     Values coming from expressions/credentials are NOT hardcoded secrets, so
#     the secret rules exclude them.
# =============================================================================
rules:
  # ---------------------------------------------------------------------------
  # SECRETS
  # ---------------------------------------------------------------------------
  - id: n8n-hardcoded-secret-parameter
    languages: [json]
    severity: ERROR
    message: >-
      Parameter $KEY holds a literal value that looks like a secret. Workflow
      JSON is exported, shared and versioned in plain text, so this value is
      exposed to anyone who can read the workflow.
    patterns:
      - pattern: '"$KEY": "$VALUE"'
      # Any key *containing* a secret word (dbPassword, smtp_pass, x_api_key,
      # clientSecret, ...), except n8n option names that only describe auth
      # (authentication, tokenType, accessTokenUrl, secretName, ...).
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^"?(?!(authentication|author)"?$)(?![\w.-]*(url|uri|type|mode|field|name|header|path|location|id|endpoint|expires|expiry|length|count|enabled|required|format|method|hint|policy)"?$)([\w.-]*(password|passwd|pwd|passphrase|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|credential)[\w.-]*|([\w.-]*[_.-])?pass|auth[_-]?(key|token|code|string))"?$
      # Literal of 4+ chars: not an "=" expression and not a placeholder.
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^"?(?!=)(?!(your[_-]|<|\$\{|\{\{|x{3,}"?$|\*{3,}|placeholder|redacted|null"?$|none"?$|true"?$|false"?$))[^"\s][^"]{3,}"?$
    metadata:
      title: Hardcoded secret in node parameter
      brief: "A password, token or API key is written directly into a node setting."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Move the value into an n8n Credential (Settings > Credentials) and
        reference it from the node, or read it from an environment variable
        via an expression such as {{ $env.MY_SECRET }}. Rotate the exposed
        secret, since it has already been stored in plain text.

  - id: n8n-hardcoded-secret-name-value-pair
    languages: [json]
    severity: ERROR
    message: >-
      A header/query/body/Set-node field named $NAME is assigned a literal
      value. Authentication material in name/value pairs is stored in clear
      text inside the workflow.
    patterns:
      - pattern: '{..., "name": "$NAME", "value": "$VALUE", ...}'
      # Header / field names containing a secret word: Authorization,
      # X-Shopify-Access-Token, adminPassword, Cookie, ...
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^"?(?![\w.-]*(url|uri|type|mode|name|id|length|hint)"?$)[\w.-]*(authorization|api[-_]?key|apikey|token|password|passwd|pwd|passphrase|secret|private[-_]?key|cookie|credential)[\w.-]*"?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^"?(?!=)(?!(your[_-]|<|\$\{|\{\{|x{3,}"?$|\*{3,}|placeholder|redacted|null"?$|none"?$))[^"\s][^"]{3,}"?$
    metadata:
      title: Hardcoded credential in header / field
      brief: "A header or form field contains a hardcoded credential."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Use the HTTP Request node's "Authentication" setting with a Generic
        Credential (Header Auth, Bearer, OAuth2, ...) instead of hand-written
        headers, or reference {{ $env.VAR }}. Rotate the exposed value.

  - id: n8n-known-secret-format
    languages: [json]
    severity: ERROR
    message: >-
      A string matches the format of a well-known provider secret (cloud key,
      VCS token, chat token, payment key, LLM API key, JWT or private key).
    pattern-either:
      - pattern-regex: \bAKIA[0-9A-Z]{16}\b                        # AWS access key id
      - pattern-regex: \bgh[pousr]_[A-Za-z0-9]{36,}\b              # GitHub token
      - pattern-regex: \bgithub_pat_[A-Za-z0-9_]{60,}\b            # GitHub fine-grained PAT
      - pattern-regex: \bxox[abposr]-[A-Za-z0-9-]{10,}\b           # Slack token
      - pattern-regex: \b[rs]k_live_[0-9A-Za-z]{20,}\b             # Stripe live key
      - pattern-regex: \bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{32,}\b    # OpenAI / Anthropic style key
      - pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b                   # Google API key
      - pattern-regex: \bglpat-[A-Za-z0-9_-]{20,}\b                # GitLab PAT
      - pattern-regex: \beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}  # JWT
      - pattern-regex: -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----
    metadata:
      title: Provider secret / private key embedded in workflow
      brief: "A real provider key or token (for example AWS, GitHub or OpenAI) is stored in the workflow."
      risk: critical
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Revoke and rotate this secret immediately at the provider, then store
        the replacement in an n8n Credential or an environment variable.
        Check git history / shared exports for other copies.

  - id: n8n-credentials-in-url
    languages: [json]
    severity: ERROR
    message: >-
      A URL carries credentials, either as user:password@host or as a secret
      query parameter (?password=, ?api_key=, ?token=). URLs are stored in
      clear text and routinely written to proxy and server logs.
    pattern-either:
      - pattern-regex: \b[a-z][a-z0-9+.-]*://[^/\s:@"]+:[^/\s@"]+@[^\s"]+
      - pattern-regex: (?i)[?&](password|passwd|pwd|pass|secret|client_secret|api[_-]?key|apikey|token|access_token|auth_token|key)=(?![{$<]|%7B)[^&"\s#\\]{4,}
    metadata:
      title: Credentials embedded in URL
      brief: "A URL contains a username and password or a secret key."
      risk: high
      category: secrets
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Remove the credentials from the URL. Configure Basic Auth, Query Auth
        or the database/service credential type through n8n Credentials so the
        value is stored encrypted, and rotate the exposed secret.

  - id: n8n-hardcoded-secret-in-code-or-body
    languages: [json]
    severity: ERROR
    message: >-
      A password, token or API key is hardcoded inside a Code node, a raw
      JSON/text body or a connection string. Embedded secrets are easy to miss
      in review and travel with every copy of the workflow.
    pattern-either:
      # JS/Python assignment or object literal: password = 'x', apiKey: "x",
      # and escaped JSON inside a string: \"password\": \"x\"
      - pattern-regex: (?i)\b[\w-]*(password|passwd|pwd|passphrase|secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key|token)(\\")?\s*[:=]\s*(\\"|'|`)(?![=$<{])(?!(your[_-]|xxx|\*\*\*))[^"'`\\\s]{4,}(\\"|'|`)
      # ADO/JDBC-style connection string: ...;Password=secret;
      - pattern-regex: (?i)(?<![\w-])(password|pwd)\s*=\s*(?![{$<'"\\])[^;"'\\\s]{3,}\s*;
    metadata:
      title: Hardcoded secret in code, body or connection string
      brief: "A password or key is hardcoded inside code, a request body or a connection string."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Remove the literal from the code/body. Use an n8n Credential on the
        node, or reference {{ $env.MY_SECRET }} / $env in the expression, and
        rotate the exposed value.

  - id: n8n-literal-authorization-token
    languages: [json]
    severity: ERROR
    message: >-
      A literal Bearer/Basic authorization value appears in the workflow. A
      Basic value is only base64 of user:password, so it is a plain-text
      password.
    # Token must look random: contain a digit or a lower->UPPER case change,
    # so prose such as "Basic Authentication" is not reported.
    pattern-regex: \b([Bb]earer|[Bb]asic|BEARER|BASIC)\s+(?=[A-Za-z0-9._~+/-]*(\d|[a-z][A-Za-z0-9._~+/-]*[A-Z]))[A-Za-z0-9._~+/-]{12,}=*
    metadata:
      title: Hardcoded Bearer / Basic authorization value
      brief: "A Bearer or Basic login token is hardcoded in the workflow."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Configure Header Auth / Basic Auth / Bearer credentials on the node
        instead of writing the header value, and rotate the token or password.

  # ---------------------------------------------------------------------------
  # TRANSPORT SECURITY
  # ---------------------------------------------------------------------------
  - id: n8n-tls-verification-disabled
    languages: [json]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled. Traffic from this node can be
      intercepted or tampered with by a man-in-the-middle.
    pattern-either:
      - pattern: '"allowUnauthorizedCerts": true'
      - pattern: '"ignoreSSLIssues": true'
      - pattern: '"ignoreSslIssues": true'
      - pattern: '"rejectUnauthorized": false'
      - pattern: '"skipSslVerification": true'
      - pattern: '"ssl": "disable"'
    metadata:
      title: TLS certificate verification disabled
      brief: "SSL certificate checks are turned off, so traffic can be intercepted."
      risk: high
      category: transport
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      remediation: >-
        Re-enable certificate validation. For internal services with private
        CAs, add the CA to the n8n container trust store (NODE_EXTRA_CA_CERTS)
        instead of turning verification off.

  - id: n8n-cleartext-http-url
    languages: [json]
    severity: WARNING
    message: >-
      Node calls a non-local endpoint over plain HTTP ($URL). Request data,
      tokens and responses travel unencrypted.
    patterns:
      - pattern: '"url": "$URL"'
      - metavariable-regex:
          metavariable: $URL
          regex: ^"?=?\s*http://(?!(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|host\.docker\.internal)(:\d+)?([/"]|$))
    metadata:
      title: Clear-text HTTP endpoint
      brief: "Data is sent over unencrypted http:// instead of https://."
      risk: medium
      category: transport
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      remediation: Use an https:// endpoint.

  # ---------------------------------------------------------------------------
  # INJECTION / CODE EXECUTION
  # ---------------------------------------------------------------------------
  - id: n8n-command-injection-via-expression
    languages: [json]
    severity: ERROR
    message: >-
      A shell command is built from an n8n expression. If any referenced data
      originates from a webhook, form, email or external API, an attacker can
      inject arbitrary shell commands on the n8n host / SSH target.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(executeCommand|ssh)"?$
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          # metavariable-regex is anchored at the start -> leading (?s).*
          regex: (?s).*\{\{.*\}\}
    metadata:
      title: Command injection via expression in shell node
      brief: "Outside data is inserted into a shell command, letting an attacker run commands on the server."
      risk: critical
      category: injection
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      remediation: >-
        Never interpolate untrusted data into shell commands. Validate input
        against a strict allow-list in a preceding node, or replace the shell
        call with a purpose-built node / HTTP API. If a command is unavoidable,
        pass data via files or environment, not string concatenation.

  - id: n8n-execute-command-node
    languages: [json]
    severity: WARNING
    message: >-
      The workflow uses the Execute Command node, which runs arbitrary shell
      commands with the privileges of the n8n process.
    pattern: '"type": "n8n-nodes-base.executeCommand"'
    metadata:
      title: Execute Command node in use
      brief: "The workflow runs shell commands on the n8n server."
      risk: medium
      category: code-execution
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      remediation: >-
        Prefer dedicated nodes. If shell access is required, keep commands
        static, run n8n as an unprivileged user in a hardened container, and
        consider disabling the node instance-wide with
        NODES_EXCLUDE='["n8n-nodes-base.executeCommand"]'.

  - id: n8n-code-node-dangerous-api
    languages: [json]
    severity: ERROR
    message: >-
      Code in $FIELD uses a high-risk API (dynamic evaluation, child processes,
      filesystem/network modules or environment access).
    patterns:
      - pattern: '"$FIELD": "$CODE"'
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^"?(jsCode|functionCode|code|pythonCode)"?$
      - metavariable-regex:
          metavariable: $CODE
          regex: (?s).*(child_process|\beval\s*\(|new\s+Function\s*\(|require\s*\(\W*(fs|child_process|net|vm|os|http|https|dgram|worker_threads)\b|process\.env|\bexecSync\s*\(|\bspawn(Sync)?\s*\(|\bsubprocess\b|os\.system|__import__|\bexec\s*\()
    metadata:
      title: Risky API in Code / Function node
      brief: "Custom code uses risky functions such as eval, child processes or environment variables."
      risk: high
      category: code-execution
      cwe: "CWE-95: Eval Injection"
      owasp: "A03:2021 - Injection"
      remediation: >-
        Remove eval/new Function and process spawning from Code nodes. Keep
        NODE_FUNCTION_ALLOW_BUILTIN / NODE_FUNCTION_ALLOW_EXTERNAL restricted
        (unset or an explicit allow-list), use N8N_BLOCK_ENV_ACCESS_IN_NODE=true,
        and pass configuration through credentials rather than process.env.

  - id: n8n-sql-injection-via-expression
    languages: [json]
    severity: ERROR
    message: >-
      A SQL statement is built with an n8n expression ({{ ... }}). Values
      interpolated directly into SQL allow SQL injection.
    patterns:
      - pattern: '"query": "$SQL"'
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is).*\b(select|insert|update|delete|merge|drop|alter|create|exec|call|with)\b.*\{\{.*\}\}
    metadata:
      title: SQL injection via expression
      brief: "Outside data is inserted into a SQL query, letting an attacker read or change the database."
      risk: high
      category: injection
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      remediation: >-
        Use query parameters: write placeholders ($1, $2 for Postgres; ? for
        MySQL) and supply the values via the node's "Query Parameters" /
        queryReplacement option, or use the Insert/Update operations.

  # ---------------------------------------------------------------------------
  # ACCESS CONTROL
  # ---------------------------------------------------------------------------
  - id: n8n-webhook-without-authentication
    languages: [json]
    severity: WARNING
    message: >-
      An inbound trigger ($TYPE) accepts requests without authentication.
      Anyone who discovers the URL can trigger the workflow.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(webhook|formTrigger)"?$
      - pattern-either:
          # authentication omitted -> n8n default is "none"
          - patterns:
              - pattern: '"parameters": $P'
              - pattern-not: '"parameters": {..., "authentication": $A, ...}'
          - pattern: '"authentication": "none"'
    metadata:
      title: Webhook / form trigger without authentication
      brief: "This webhook or form can be called by anyone without logging in."
      risk: medium
      category: access-control
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "A01:2021 - Broken Access Control"
      remediation: >-
        Set Authentication to Header Auth, Basic Auth or JWT Auth on the
        trigger. If the caller cannot authenticate (third-party callbacks),
        verify an HMAC signature in the first node and reject mismatches.

  - id: n8n-webhook-permissive-cors
    languages: [json]
    severity: WARNING
    message: >-
      The webhook allows requests from any origin (allowedOrigins = "*"), so
      any website can call it from a visitor's browser.
    pattern: '"allowedOrigins": "*"'
    metadata:
      title: Webhook allows any CORS origin
      brief: "Any website can call this webhook from a visitor's browser."
      risk: medium
      category: access-control
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      remediation: List the specific origins that need access in "Allowed Origins (CORS)".

  # ---------------------------------------------------------------------------
  # DATA EXPOSURE
  # ---------------------------------------------------------------------------
  - id: n8n-pinned-data-exported
    languages: [json]
    severity: INFO
    message: >-
      The export contains pinned execution data. Pinned data is real sample
      input/output and frequently contains personal data or tokens.
    pattern: '"pinData": {..., "$NODE": $DATA, ...}'
    metadata:
      title: Pinned execution data included in export
      brief: "Real sample data is saved inside the workflow export."
      risk: low
      category: data-exposure
      cwe: "CWE-200: Exposure of Sensitive Information"
      remediation: >-
        Unpin the data (or delete the "pinData" block) before sharing or
        committing the workflow.

  # ---------------------------------------------------------------------------
  # AI AGENTS  (OWASP Top 10 for LLM Applications 2025)
  # Workflow-wide AI checks that need the connection graph (prompt injection
  # -> data exfiltration, agent replies leaking private data) live in
  # app/graph.py; the rules below cover single-node misconfigurations.
  # ---------------------------------------------------------------------------
  - id: n8n-ai-tool-model-controlled-url
    languages: [json]
    severity: ERROR
    message: >-
      The AI model chooses the URL this HTTP tool calls. A prompt-injected
      agent can send any data it has seen to an attacker's server
      (e.g. https://evil.example/?d=<mailbox contents>) or reach internal
      services (SSRF).
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?(@n8n/n8n-nodes-langchain\.toolHttpRequest|n8n-nodes-base\.httpRequestTool)"?$
      - pattern: '"url": "$URL"'
      # Host part comes from $fromAI(...) or a {placeholder}.
      - metavariable-regex:
          metavariable: $URL
          regex: ^"?=?\s*(https?://)?(\{[^{]|\{\{\s*\$fromAI)
    metadata:
      title: AI tool can call any URL the model chooses
      brief: "The AI chooses which URL to call, so it can be tricked into sending data anywhere."
      risk: high
      category: ai-agent
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "LLM06:2025 Excessive Agency"
      remediation: >-
        Hardcode the scheme and host (e.g. https://api.example.com/...) and let
        the model fill only specific path or query values. If several hosts
        are needed, create one tool per host.

  - id: n8n-ai-tool-model-chosen-recipient
    languages: [json]
    severity: ERROR
    message: >-
      The AI model decides $KEY for this $TYPE action. Through prompt
      injection (a crafted email, chat message or document) an attacker can
      make the agent send internal data to an address or channel they control.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(microsoftOutlook|microsoftTeams|mondayCom|gmail|emailSend|slack|telegram|whatsApp|discord|microsoftOneDrive|microsoftSharePoint|googleDrive|mattermost)Tool"?$
      - pattern: '"$KEY": "$VALUE"'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^"?(toRecipients|ccRecipients|bccRecipients|to|cc|bcc|sendTo|toEmail|recipient|recipients|email|emailAddress|chatId|channelId|teamId|boardId|groupId|userId|user|webhookUri|shareWith)"?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?s).*\$fromAI
    metadata:
      title: AI decides who receives data
      brief: "The AI decides who receives emails or messages, so data can be sent to an attacker."
      risk: high
      category: ai-agent
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "LLM06:2025 Excessive Agency"
      remediation: >-
        Fix the recipient / channel / board in the tool configuration, or
        restrict it with an allow-list check (e.g. only @yourcompany.com) in a
        sub-workflow tool. For sends that matter, use Outlook/Teams
        "Send and Wait for Response" so a human approves first.

  - id: n8n-ai-tool-destructive-operation
    languages: [json]
    severity: WARNING
    message: >-
      An AI agent tool performs a destructive operation ($OP). A wrong model
      decision or a prompt injection can delete or move business data without
      human review.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?(n8n-nodes-base\.\w+Tool|@n8n/n8n-nodes-langchain\.tool\w+)"?$
      - pattern: '"operation": "$OP"'
      - metavariable-regex:
          metavariable: $OP
          regex: (?i)^"?(delete\w*|remove\w*|archive\w*|move\w*|clear\w*|purge\w*|trash\w*)"?$
    metadata:
      title: AI agent can delete or move data
      brief: "The AI agent can delete or move business data on its own."
      risk: medium
      category: ai-agent
      cwe: "CWE-285: Improper Authorization"
      owasp: "LLM06:2025 Excessive Agency"
      remediation: >-
        Remove destructive tools from the agent, or put them behind a human
        approval step (Send and Wait for Response) and a sub-workflow that
        validates the target item.

  - id: n8n-ai-prompt-contains-env-secret
    languages: [json]
    severity: ERROR
    message: >-
      An AI prompt ($KEY) includes an environment variable via $env. The value
      is sent to the model provider and can be extracted by anyone who can
      talk to the agent ("repeat your instructions").
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?@n8n/n8n-nodes-langchain\.(agent\w*|chain\w*|openAi|lmChat\w*|lmOpenAi|informationExtractor|textClassifier|sentimentAnalysis)"?$
      - pattern: '"$KEY": "$VALUE"'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^"?(systemMessage|text|prompt|message|content|instructions|inputText|systemPromptTemplate|humanMessage)"?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?s).*\$env\b
    metadata:
      title: Secret placed in AI prompt
      brief: "A secret is placed in the AI prompt, where the AI provider and chat users can see it."
      risk: high
      category: ai-agent
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "LLM07:2025 System Prompt Leakage"
      remediation: >-
        Never put secrets in prompts. Give the agent a tool that uses an n8n
        Credential instead; the model then never sees the secret.

  - id: n8n-ai-chat-public-without-auth
    languages: [json]
    severity: ERROR
    message: >-
      The chat trigger is public with no authentication. Anyone with the URL
      can talk to the agent, use its tools and read whatever data those tools
      can reach.
    patterns:
      - pattern-inside: '{..., "type": "@n8n/n8n-nodes-langchain.chatTrigger", ...}'
      - pattern: '"parameters": {..., "public": true, ...}'
      - pattern-not: '"parameters": {..., "authentication": "basicAuth", ...}'
      - pattern-not: '"parameters": {..., "authentication": "n8nUserAuth", ...}'
    metadata:
      title: Public AI chat without authentication
      brief: "Anyone on the internet can chat with this AI agent."
      risk: high
      category: ai-agent
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      remediation: >-
        Set the chat trigger's Authentication to "n8n User Auth" (internal
        users) or Basic Auth, or make it non-public and embed it behind your
        own authenticated app.

  - id: n8n-ai-mcp-server-without-auth
    languages: [json]
    severity: ERROR
    message: >-
      This MCP Server Trigger exposes the workflow's tools to any MCP client
      without authentication. External AI clients can call every attached
      tool, including ones that read Outlook, Teams or monday.com data.
    patterns:
      - pattern-inside: '{..., "type": "@n8n/n8n-nodes-langchain.mcpTrigger", ...}'
      - pattern-either:
          - patterns:
              - pattern: '"parameters": $P'
              - pattern-not: '"parameters": {..., "authentication": $A, ...}'
          - pattern: '"authentication": "none"'
    metadata:
      title: MCP server exposes tools without authentication
      brief: "Any AI client can use this workflow's tools without logging in."
      risk: high
      category: ai-agent
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "LLM06:2025 Excessive Agency"
      remediation: Set Authentication to Bearer or Header Auth on the MCP Server Trigger.

  - id: n8n-ai-shared-conversation-memory
    languages: [json]
    severity: ERROR
    message: >-
      Chat memory uses the fixed session key "$KEY", so every user shares one
      conversation history. One user can ask the agent what earlier users
      said or what data it fetched for them.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?@n8n/n8n-nodes-langchain\.memory\w+"?$
      - pattern: '"sessionKey": "$KEY"'
      - metavariable-regex:
          metavariable: $KEY
          regex: ^"?[^="\s]
    metadata:
      title: AI memory shared between users
      brief: "All users share one chat history, so one user can see another user's conversation."
      risk: high
      category: ai-agent
      cwe: "CWE-488: Exposure of Data Element to Wrong Session"
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      remediation: >-
        Use a per-user / per-conversation key, e.g. {{ $json.sessionId }} from
        the chat trigger or the Teams chat id, so histories stay separate.

  - id: n8n-ai-intermediate-steps-exposed
    languages: [json]
    severity: INFO
    message: >-
      The agent returns its intermediate steps. Raw tool inputs and outputs
      (e.g. full email bodies or board rows) are included in the response.
    pattern: '"returnIntermediateSteps": true'
    metadata:
      title: Agent returns raw tool outputs
      brief: "The agent's raw tool results (such as full emails) are returned with its answer."
      risk: low
      category: ai-agent
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      remediation: >-
        Turn off "Return Intermediate Steps" unless you need it for debugging,
        and never return it to end users.

  # ---------------------------------------------------------------------------
  # MICROSOFT OUTLOOK / TEAMS / MONDAY.COM
  # ---------------------------------------------------------------------------
  - id: n8n-teams-webhook-url-exposed
    languages: [json]
    severity: ERROR
    message: >-
      A Microsoft Teams incoming-webhook / Power Automate workflow URL is
      stored in the workflow. The URL itself is the credential: anyone who has
      it can post messages (including phishing links) into the channel.
    pattern-either:
      - pattern-regex: https://[A-Za-z0-9-]+\.webhook\.office\.com/webhookb2/[^\s"]+
      - pattern-regex: https://[^\s"/]*\.logic\.azure\.com[^\s"]*[?&]sig=[^\s"&]+
      - pattern-regex: https://[^\s"/]*\.powerplatform\.com[^\s"]*[?&]sig=[^\s"&]+
    metadata:
      title: Teams webhook URL exposed
      brief: "A Teams webhook URL, which works like a password, is stored in the workflow."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Store the URL in an environment variable ({{ $env.TEAMS_WEBHOOK_URL }})
        or use the Microsoft Teams node with an OAuth2 credential. Regenerate
        the webhook in Teams since this URL has been exposed.

  - id: n8n-email-hidden-bcc
    languages: [json]
    severity: WARNING
    message: >-
      Outgoing email is silently copied (BCC) to "$VALUE". A hidden recipient
      is a common way to leak mail out of the organisation unnoticed.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(microsoftOutlook|gmail|emailSend)(Tool)?"?$
      - pattern: '"$KEY": "$VALUE"'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^"?(bccRecipients|bcc|bccList|bccEmail)"?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^"?[^"\s]
    metadata:
      title: Hidden BCC recipient on outgoing email
      brief: "Outgoing emails are secretly copied to another address."
      risk: medium
      category: integrations
      cwe: "CWE-359: Exposure of Private Personal Information to an Unauthorized Actor"
      remediation: >-
        Remove the BCC unless it is an approved internal archive address. Use
        Microsoft 365 journaling or retention policies for archiving instead.

  - id: n8n-email-recipient-from-request
    languages: [json]
    severity: WARNING
    message: >-
      The email recipient ($KEY) comes from webhook / form input. Whoever
      calls the endpoint decides where this email, and any data in it, is
      sent.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(microsoftOutlook|gmail|emailSend)"?$
      - pattern: '"$KEY": "$VALUE"'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^"?(toRecipients|ccRecipients|to|cc|sendTo|toEmail)"?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?s).*(\$json\.(body|query|headers)\b|\$\(\s*'[^']*(Webhook|Form|Trigger)[^']*'\s*\))
    metadata:
      title: Email recipient controlled by request data
      brief: "Whoever calls the webhook decides who the email is sent to."
      risk: medium
      category: integrations
      cwe: "CWE-441: Unintended Proxy or Intermediary"
      remediation: >-
        Only send to addresses you have verified (e.g. look the user up in your
        directory first), never include internal data in mail sent to a
        caller-supplied address, and add rate limiting.

  - id: n8n-bulk-record-forwarded
    languages: [json]
    severity: WARNING
    message: >-
      $KEY sends the entire item ($json / all items) to $TYPE. Every field
      from earlier steps, including personal data, email content or tokens,
      is posted to the destination.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(microsoftOutlook|microsoftTeams|mondayCom|gmail|emailSend|slack|telegram|whatsApp|discord|mattermost|googleChat|httpRequest)(Tool)?"?$
      - pattern: '"$KEY": "$VALUE"'
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?s).*(JSON\.stringify\(\s*\$(json|input|items|node|\()|\{\{\s*\$json\s*\}\}|\$input\.all\(\)|\.all\(\)\s*\}\})
    metadata:
      title: Entire record forwarded to external service
      brief: "Entire records, with every field, are sent to another service."
      risk: medium
      category: integrations
      cwe: "CWE-212: Improper Removal of Sensitive Information Before Storage or Transfer"
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      remediation: >-
        Send only the fields the recipient needs (e.g. {{ $json.ticketId }},
        {{ $json.summary }}). Add an Edit Fields (Set) node with "Keep only set
        fields" before the send.

  - id: n8n-bulk-read-internal-data
    languages: [json]
    severity: INFO
    message: >-
      $TYPE reads all records (returnAll = true). Large mailbox / board reads
      increase what can leak if this data flows to an AI model, a webhook
      response or an external service.
    patterns:
      - pattern-inside: '{..., "type": "$TYPE", ...}'
      - metavariable-regex:
          metavariable: $TYPE
          regex: ^"?n8n-nodes-base\.(microsoftOutlook|microsoftTeams|mondayCom|gmail|microsoftOneDrive|microsoftSharePoint)(Tool)?"?$
      - pattern: '"returnAll": true'
    metadata:
      title: Bulk read of mailbox / board data
      brief: "The workflow reads every email or board item instead of only what it needs."
      risk: low
      category: integrations
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      remediation: >-
        Set a Limit and filters (folder, sender, date, board group) so only
        the records the workflow needs are read.
