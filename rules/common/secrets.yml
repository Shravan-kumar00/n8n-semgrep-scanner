# =============================================================================
# Secret detection shared by every code / config language (not n8n, which has
# its own JSON-aware rules). Regex based ("generic"), so it works on any text.
#
# Metadata conventions are the same as rules/n8n/n8n-security.yml:
#   title, brief, risk, category, cwe, owasp, remediation
# =============================================================================
rules:
  - id: known-secret-format
    languages: [generic]
    severity: ERROR
    message: >-
      A string matches the format of a well-known provider secret (cloud key,
      VCS token, chat token or webhook, payment key, LLM API key, JWT or
      private key).
    pattern-either:
      - pattern-regex: \bAKIA[0-9A-Z]{16}\b                        # AWS access key id
      - pattern-regex: \bASIA[0-9A-Z]{16}\b                        # AWS temporary key id
      - pattern-regex: \bgh[pousr]_[A-Za-z0-9]{36,}\b              # GitHub token
      - pattern-regex: \bgithub_pat_[A-Za-z0-9_]{60,}\b            # GitHub fine-grained PAT
      - pattern-regex: \bglpat-[A-Za-z0-9_-]{20,}\b                # GitLab PAT
      - pattern-regex: \bxox[abposr]-[A-Za-z0-9-]{10,}\b           # Slack token
      - pattern-regex: https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+  # Slack webhook
      - pattern-regex: https://[A-Za-z0-9-]+\.webhook\.office\.com/webhookb2/[^\s"'`]+         # Teams webhook
      - pattern-regex: \b[rs]k_live_[0-9A-Za-z]{20,}\b             # Stripe live key
      - pattern-regex: \bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{32,}\b    # OpenAI / Anthropic style key
      - pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b                   # Google API key
      - pattern-regex: \bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b  # SendGrid key
      - pattern-regex: \bnpm_[A-Za-z0-9]{36}\b                     # npm token
      - pattern-regex: \beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}  # JWT
      - pattern-regex: -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----
    metadata:
      title: Provider secret or private key in source
      brief: "A real provider key, token or private key is stored in the file."
      risk: critical
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Revoke and rotate the secret at the provider now, then load the new
        value from a secret manager or environment variable. Remove it from
        git history (git filter-repo / BFG) and any copies.

  - id: hardcoded-password-or-key
    languages: [generic]
    severity: ERROR
    message: >-
      A variable, property or key whose name indicates a password, secret,
      token or API key is assigned a literal string.
    # name ... [:=|:=|=>] "literal". The name must not merely describe a
    # secret (password_field, token_type, secret_name, api_key_url, ...), and
    # the value must not be a placeholder or a ${VAR} / {{ }} reference.
    pattern-regex: (?i)(?<![\w.-])["']?(?![\w.-]*(?:name|field|label|type|url|uri|id|path|header|placeholder|hint|prompt|message|msg|pattern|regex|policy|length|count|enabled|required|format|file|dir|hash|tokenizer|tokens|prefix|env|var|key_id)["']?\s*(?::=|=>|[:=]))[\w.-]*(?:password|passwd|pwd|passphrase|secret|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?token|access[_-]?token|client[_-]?secret|token)[\w.-]*["']?\s*(?::=|=>|[:=])\s*["'`](?![\s"'`{<%$]|your[_-]|xxx|\*\*\*|change[_-]?me[_-]?placeholder)[^"'`\n]{4,}["'`]
    metadata:
      title: Hardcoded password, token or API key
      brief: "A password, token or API key is written directly into the file."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Read the value from an environment variable or a secret manager
        (AWS Secrets Manager, Azure Key Vault, Vault, Kubernetes Secrets) and
        rotate the exposed credential.

  - id: connection-string-password
    languages: [generic]
    severity: ERROR
    message: A database connection string contains a literal password (Password=...;).
    # Key=value pairs inside a string: no spaces around "=", preceded by the
    # string start or ";" and terminated by ";" or the closing quote.
    pattern-regex: (?i)(?<=[;"'])\s*(?:password|pwd)=(?![{<'"\\]|\$\{|\$\(|%\()[^;"'\\\s()]{3,}(?=;|["'])
    metadata:
      title: Password in connection string
      brief: "A database connection string contains a plain-text password."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Load the connection string from configuration that is not committed
        (environment variables, user secrets, Key Vault) or use managed
        identity / integrated authentication. Rotate the password.

  - id: credentials-in-url
    languages: [generic]
    severity: ERROR
    message: >-
      A URL carries credentials, either as user:password@host or as a secret
      query parameter. URLs are logged by proxies and servers in clear text.
    pattern-either:
      - pattern-regex: \b[a-z][a-z0-9+.-]*://[^/\s:@"'`$]+:[^/\s@"'`{$<]+@[^\s"'`]+
      - pattern-regex: (?i)[?&](password|passwd|pwd|secret|client_secret|api[_-]?key|apikey|access_token|auth_token)=(?![{$<]|%7B)[^&"'`\s#\\]{4,}
    metadata:
      title: Credentials embedded in URL
      brief: "A URL contains a username and password or a secret key."
      risk: high
      category: secrets
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Remove the credentials from the URL and pass them through the client
        library's auth options, loaded from a secret manager or environment
        variable. Rotate the exposed credential.
