# =============================================================================
# Unquoted secrets in config-style files: .env, YAML, .properties, .ini and
# shell scripts (PASSWORD=abc, password: abc). Only used for languages where
# an unquoted value is a literal (not for programming languages, where
# `password = get_password()` is a function call).
# =============================================================================
rules:
  - id: hardcoded-secret-in-config
    languages: [generic]
    severity: ERROR
    message: >-
      A configuration key whose name indicates a password, secret, token or
      API key is set to a literal value.
    pattern-regex: (?im)^[ \t-]*(?:export[ \t]+)?["']?(?![\w.-]*(?:name|field|label|type|url|uri|id|path|header|placeholder|hint|pattern|regex|policy|length|count|enabled|required|format|file|dir|hash|ref|key_?ref|prefix|env|var)["']?[ \t]*[:=])[\w.-]*(?:password|passwd|pwd|passphrase|secret|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?token|access[_-]?token|client[_-]?secret|token)[\w.-]*["']?[ \t]*[:=][ \t]*(?![\s"'`$%{<>|&!*~]|your[_-]|xxx|true\b|false\b|null\b|none\b)[^\s#"'`]{4,}[ \t]*(?:#.*)?$
    metadata:
      title: Hardcoded secret in configuration
      brief: "A password, token or API key is stored in plain text in a configuration file."
      risk: high
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: >-
        Keep secrets out of committed config: reference them (${DB_PASSWORD},
        Kubernetes secretKeyRef, GitHub ${{ secrets.X }}) and store the values
        in a secret manager. Rotate the exposed value.
